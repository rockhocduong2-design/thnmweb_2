<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Shop Giày</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* --- CÀI ĐẶT RIÊNG CHO TRANG ĐĂNG NHẬP --- */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f4;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-box {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 60px 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .login-box h1 {
            font-size: 34px;
            letter-spacing: -1px;
            color: #111;
        }

        .custom-input {
            background-color: #faf8f8;
            border: 1px solid #e0e0e0;
            border-radius: 2px;
            padding: 12px 15px;
            font-size: 14px;
        }

        .custom-input:focus {
            background-color: #fff;
            border-color: #333;
            box-shadow: none;
        }

        .custom-btn {
            background-color: #1a1a1a;
            border-radius: 2px;
            font-size: 15px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .custom-btn:hover {
            background-color: #333;
        }

        a {
            color: #333;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1 class="fw-bold mb-3">Đăng nhập</h1>

        <p class="text-muted mb-4 lh-base" style="font-size: 14px;">
            Đăng nhập để trải nghiệm những đặc quyền tuyệt vời nhất từ Cửa hàng và nhận ưu đãi riêng dành cho bạn.
        </p>

        <p class="mb-4" style="font-size: 15px;">
            Bạn chưa có tài khoản? <a href="dangki.html" class="text-decoration-underline">Đăng kí?</a>
        </p>

        <form action="xuly_login.php" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label fw-medium" style="font-size: 15px;">Email <span
                        class="text-danger">*</span></label>
                <input type="email" class="form-control custom-input" id="email"
                    placeholder="Điền địa chỉ email của bạn..." name="txtEmail">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-medium" style="font-size: 15px;">Password <span
                        class="text-danger">*</span></label>
                <input type="password" class="form-control custom-input" id="password"
                    placeholder="Điền mật khẩu của bạn..." name="txtPassword">
            </div>

            <button type="submit" class="btn text-white w-100 py-3 fw-bold mb-4 custom-btn">ĐĂNG NHẬP</button>

            <a href="quenmatkhau.html" class="text-decoration-underline" style="font-size: 14px;">Quên mật khẩu?</a>
        </form>
    </div>

</body>

</html>
