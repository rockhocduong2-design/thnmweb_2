<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Shop Giày</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f4; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-box {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px; 
            padding: 70px 45px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.04);
            border-radius: 2px;
        }

        .login-box h1 {
            font-size: 38px;
            letter-spacing: -1.5px;
            color: #111;
            margin-bottom: 20px;
        }

        .login-box p {
            font-size: 15px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }

        .custom-input {
            background-color: #faf8f8; 
            border: 1px solid #e0e0e0;
            border-radius: 0px;
            padding: 14px 15px;
            font-size: 15px;
        }

        .custom-input:focus {
            background-color: #fff;
            border-color: #333;
            box-shadow: none;
        }

        .form-label {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .custom-btn {
            background-color: #1a1a1a;
            color: white;
            border: none;
            border-radius: 0px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 16px 0;
            transition: 0.3s;
            margin-top: 10px;
        }

        .custom-btn:hover {
            background-color: #333;
            color: white;
        }

        
    </style>
</head>
<body>

    <div class="login-box">
        <h1 class="fw-bold">Quên mật khẩu?</h1>
        
        <p>
            Vui lòng nhập địa chỉ email của bạn dưới đây để nhận được một liên kết đặt lại mật khẩu.
        </p>

        <form>
            <div class="mb-4">
                <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control custom-input" id="email" placeholder="Điền địa chỉ email của bạn...">
            </div>

            <button type="submit" class="btn custom-btn w-100">GỬI</button>
        </form>
    </div>

</body>
</html>
